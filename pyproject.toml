[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dse-knowledge"
version = "0.1.0"
description = "Source-grounded DSE knowledge workbench"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]==3.3.6", "beautifulsoup4>=4.12,<5", "pypdf>=5,<7", "numpy>=2.3,<3", "PyYAML>=6,<7", "jsonschema>=4,<5", "packaging>=24"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
dse-knowledge = "dse_knowledge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dse_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
